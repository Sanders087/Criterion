# Paste into Amvera's Kubernetes probes form; not into amvera.yml.
startupProbe:
  httpGet:
    path: /api/health/ready
    port: 3000
  periodSeconds: 5
  timeoutSeconds: 6
  failureThreshold: 30
readinessProbe:
  httpGet:
    path: /api/health/ready
    port: 3000
  periodSeconds: 10
  timeoutSeconds: 6
  failureThreshold: 3
livenessProbe:
  httpGet:
    path: /api/health/live
    port: 3000
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3
