rule_files:
  - alerts.yml
evaluation_interval: 1m
tests:
  - name: Confirmed order without access persists across checks
    interval: 1m
    input_series:
      - series: 'payment_confirmed_without_access{job="criterion",instance="test"}'
        values: '0 1 1 1 1'
    alert_rule_test:
      - eval_time: 1m
        alertname: CriterionPaidWithoutAccess
        exp_alerts: []
      - eval_time: 4m
        alertname: CriterionPaidWithoutAccess
        exp_alerts:
          - exp_labels:
              job: criterion
              instance: test
              severity: warning
            exp_annotations:
              summary: "Есть подтверждённые оплаты без доступа к договору"
  - name: Missing backup reports unknown
    interval: 1m
    input_series:
      - series: 'backup_last_success_timestamp_seconds{job="criterion"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
    alert_rule_test:
      - eval_time: 11m
        alertname: CriterionBackupOverdue
        exp_alerts:
          - exp_labels:
              job: criterion
              severity: warning
            exp_annotations:
              summary: "Резервная копия отсутствует, просрочена или завершилась ошибкой"
