global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - alerts.yml
scrape_configs:
  - job_name: criterion
    scheme: https
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/criterion_monitoring
    static_configs:
      - targets: ['criterion-staging.example.invalid']
